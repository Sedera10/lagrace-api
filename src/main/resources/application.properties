spring.application.name=lagrace-api
server.port= 8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lagrace_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration. Use an environment variable in deployed environments.
jwt.secret=${JWT_SECRET:maCleSuperSecretePourJWTDe32CaracteresMinimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# JPA Configuration
server.servlet.context-path=/api