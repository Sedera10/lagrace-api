spring.application.name=lagrace-api
server.port= 8080
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lagrace_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration. Use an environment variable in deployed environments.
jwt.secret=${JWT_SECRET:maCleSuperSecretePourJWTDe32CaracteresMinimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JPA Configuration
server.servlet.context-path=/api